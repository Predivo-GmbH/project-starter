# gitleaks config for project-starter (deploy-standard §4d). Extends the default rule set; the allowlist
# carries only values that are public BY DESIGN, each with its reason. A real secret never goes here.
title = "project-starter gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Public-by-design values and secret REFERENCES, never secret values"
regexes = [
  # Supabase publishable keys ship in every visitor's browser (RLS protects the data).
  '''sb_publishable_[A-Za-z0-9_-]{20,}''',
  # GitHub Actions secret references are names, not values.
  '''\$\{\{\s*secrets\.[A-Z0-9_]+\s*\}\}''',
]
# No path allowlist here. Lock files (package-lock.json, pnpm-lock.yaml, yarn.lock, ...) are already
# allowlisted by gitleaks' own default config, which useDefault above merges in (gitleaks 8.24.3
# config/gitleaks.toml; extend() appends the default's global allowlist paths). A path entry of our
# own would only repeat it, and this repo has no lock file, so the fleet guard
# production-monitor test/gitleaks-allowlists-name-files-that-exist.test.mjs fails any entry that
# names no file on master. If a project made from this starter needs a path entry, add it there,
# naming one file that exists in that project.
